<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mangoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d00" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle / Shield -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0f172a" stroke="#ff7a00" stroke-width="2.5" />

  <!-- Clock Circle -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="url(#mangoGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Clock Hands (10:10 position) -->
  <polyline points="32 19 32 32 40 32" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Accent Dot -->
  <circle cx="32" cy="32" r="3" fill="#ff7a00" />
  <circle cx="44" cy="18" r="4" fill="#10b981" />
</svg>
